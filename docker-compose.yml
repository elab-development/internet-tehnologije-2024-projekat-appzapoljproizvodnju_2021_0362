services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomateo-backend
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - /var/www/vendor
    depends_on:
      - db
    networks:
      - tomateo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tomateo-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - tomateo-network

  db:
    image: mysql:8.0
    container_name: tomateo-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tomateo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - tomateo-network

volumes:
  dbdata:

networks:
  tomateo-network:
    driver: bridge